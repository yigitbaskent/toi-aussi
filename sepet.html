<!DOCTYPE html>
<html>
<head>
    <title>Sepet | toi aussi</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-container { 
            display: 
            flex; padding: 20px; 
            gap: 20px; 
            margin-top: 80px; 
        }
        .cart-items {
            width: 70%; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
        }
        .item { 
            display: flex; 
            align-items: center; 
            border-bottom: 1px solid #eee; 
            padding: 10px 0; 
        }
        .item img { 
            width: 80px; 
            height: 100px; 
            object-fit: cover; 
            margin-right: 20px; 
        }
        .cart-summary { 
            width: 30%; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            height: fit-content; 
            border: 1px solid #ddd; 
        }
        .delete-btn { 
            background: #ff4d4d; 
            color: white; 
            border: none; 
            padding: 5px 10px; 
            cursor: pointer; 
            border-radius: 4px; 
        }

    </style>
    
</head>
<body>
    <header class="header">
        <div class="logo"><a href="index.html">toi aussi</a></div>
        <nav class="nav-links"><a href="index.html">Mağazaya Dön</a></nav>
    </header>

    <div class="cart-container">
        <div class="cart-items" id="cartItems">
            <h2>Sepetiniz</h2>
        </div>
        <div class="cart-summary">
            <h3>Toplam: <span id="totalPrice">0 TL</span></h3>
            <button class="pay-btn" onclick="alert('Ödeme sistemi bakımda!')" style="width:100%; padding:10px; background:black; color:white; cursor:pointer;">Ödeme Yap</button>
        </div>
    </div>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            const cartBox = document.getElementById("cartItems");
            const totalBox = document.getElementById("totalPrice");
            
            cartBox.innerHTML = "<h2>Sepetiniz</h2>";
            let total = 0;

            if (cart.length === 0) {
                cartBox.innerHTML += "<p>Sepetiniz şu an boş.</p>";
                totalBox.innerText = "0 TL";
                return;
            }

            cart.forEach((item, index) => {
                total += parseInt(item.price);
                cartBox.innerHTML += `
                    <div class="item">
                        <img src="${item.img}">
                        <div style="flex:1">
                            <h3>${item.title}</h3>
                            <p>Beden: ${item.size} | Fiyat: ${item.price}</p>
                        </div>
                        <button class="delete-btn" onclick="removeItem(${index})">Sil</button>
                    </div>`;
            });
            totalBox.innerText = total + " TL";
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            loadCart();
        }

        loadCart();
    </script>
</body>
</html>
