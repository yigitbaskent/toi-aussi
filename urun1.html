<!DOCTYPE html>
<html>
<head>
    <title>Oversize Hoodie | toi aussi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
<div class="logo">toi aussi</a></div>
<nav class="nav-links">
<a href="kadin.html">Kadın</a>
<a href="erkek.html">Erkek</a>
   <a href="hakkimizda.html">Hakkımızda</a>
    <a href="iletisim.html">İletişim</a>
    <a href="sorular.html">SSS</a>
    <a href="sepet.html">Sepet</a>
</nav>
</header>

    <main class="product-page">
        <div class="product-left">
            <img src="assets/urun1.jpg" id="itemImg">
        </div>
        <div class="product-right">
            <h1 id="itemTitle">Oversize Hoodie</h1>
            <h3 id="itemPrice">799 TL</h3>
            <h4>Beden Seç</h4>
            <div class="sizes">
                <button onclick="selectSize(this)">S</button>
                <button onclick="selectSize(this)">M</button>
                <button onclick="selectSize(this)">L</button>
            </div>
            <p id="selectedSizeText"></p>
            <button onclick="addToCart()">Sepete Ekle</button>
        </div>
    </main>

    <script>
        let chosenSize = "";

        function selectSize(btn) {
            document.querySelectorAll(".sizes button").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            chosenSize = btn.innerText;
            document.getElementById("selectedSizeText").innerText = "Seçilen: " + chosenSize;
        }

        function addToCart() {
            if (!chosenSize) { alert("Lütfen beden seçin!"); return; }
            
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.push({
                title: "Oversize Hoodie",
                price: "799 TL",
                size: chosenSize,
                img: "assets/urun1.jpg" 
            });
            
            localStorage.setItem("cart", JSON.stringify(cart));
            alert("Ürün sepete eklendi!");
        }
    </script>
</body>
</html>
